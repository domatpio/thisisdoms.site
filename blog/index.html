<img id="modeImg" onclick="darkModeToggle()" src="../img/moon.svg" class="modeToggle">
<script>
        
function darkModeToggle() {
	var mode = document.body;
	mode.classList.toggle("dark_mode");
	const modeImg = document.getElementById("modeImg");
	
	if (modeImg.src.includes("moon.svg")) {
		modeImg.src = "../img/light-mode.svg";
	} else {
		modeImg.src = "../img/moon.svg";
	}
}			

</script>
